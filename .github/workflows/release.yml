# GitHub Actions workflow for creating releases
# This is optional - can be used to automate releases in the future

name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      
      - name: Create ZIP
        run: |
          zip -r Moodle_Downloader_Extension.zip \
            manifest.json \
            popup.html popup.js content.js utils.js background.js \
            styles.css guide.html icon-generator.html \
            LICENSE README.md CHANGELOG.md \
            INSTALLATION_INSTRUCTIONS.md RELEASE_NOTES.md \
            icons/
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: Moodle_Downloader_Extension.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


